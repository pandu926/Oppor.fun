server {
    listen 80;
    server_name oppor.fun www.oppor.fun;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location = /healthz { access_log off; return 200 'ok\n'; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, immutable';
        add_header X-Content-Type-Options nosniff always;
    }
    # The production backend is not configured; never route to another app's API.
    location /v1/ {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The campaign API is not configured."}}';
    }
    location / {
        try_files $uri $uri/index.html /200.html;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
