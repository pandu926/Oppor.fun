server {
    listen 80;
    server_name oppor.fun www.oppor.fun;
    root /usr/share/nginx/releases/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location = /healthz { access_log off; return 200 'ok\n'; }
    location /assets/ {
        root /usr/share/nginx/releases;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, immutable';
        add_header X-Content-Type-Options nosniff always;
    }
    # Runtime metrics stay private even after API activation.
    location = /v1/metrics { return 404; }
    location /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $oppor_api http://oppor-production-api-1:8080;
        proxy_pass $oppor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }
    location / {
        try_files $uri $uri/index.html /200.html;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
