# Insert inside the existing shared reverse proxy's http block.
# BEGIN OPPOR WEB
server {
    listen 80;
    server_name oppor.fun www.oppor.fun;
    return 308 https://oppor.fun$request_uri;
}
server {
    listen 443 ssl;
    server_name www.oppor.fun;
    ssl_certificate /etc/nginx/ssl/oppor-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/oppor-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://oppor.fun$request_uri;
}
server {
    listen 443 ssl;
    server_name oppor.fun;
    ssl_certificate /etc/nginx/ssl/oppor-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/oppor-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 6m;
    location / {
        proxy_pass http://172.18.0.1:18820;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
# END OPPOR WEB
