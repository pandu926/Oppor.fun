name: oppor-web
services:
  web:
    image: nginx@sha256:e7257f1ef28ba17cf7c248cb8ccf6f0c6e0228ab9c315c152f9c203cd34cf6d1
    restart: unless-stopped
    ports:
      - "127.0.0.1:18820:80"
      - "172.18.0.1:18820:80"
    volumes:
      - /var/lib/oppor/web:/usr/share/nginx/releases:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
