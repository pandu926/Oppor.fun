name: Backend
on:
  push:
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: backend
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
      - run: bash ../contracts/scripts/bootstrap.sh
      - run: forge fmt --root ../contracts --check
      - run: forge test --root ../contracts
      - run: python3 ../contracts/scripts/deployment-smoke.py
      - run: python3 ../contracts/scripts/test-security-gates.py
      - run: python3 ../contracts/scripts/export-artifacts.py --check
      - run: python3 -m pip install -r ../contracts/scripts/requirements-static-analysis.txt
      - run: python3 ../contracts/scripts/security-check.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 scripts/generate-openapi.py --check
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: bash scripts/test.sh
      - run: python3 scripts/validate-openapi.py
      - run: cargo install cargo-audit --locked
      - run: python3 scripts/security-audit.py
      - run: docker build -t oppor-backend:verification .
      - run: python3 scripts/container-smoke.py
      - if: always()
        run: docker compose -f compose.test.yml down
