name: oppor
services:
  api:
    image: oppor-backend:local
    build: .
    env_file: .env
    environment:
      HTTP_BIND: 0.0.0.0:8080
    ports: ["127.0.0.1:8080:8080"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
  worker:
    image: oppor-backend:local
    build: .
    entrypoint: [oppor-worker]
    env_file: .env
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
  migrate:
    image: oppor-backend:local
    build: .
    profiles: [operations]
    command: [migrate]
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
